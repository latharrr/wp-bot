[project]
name = "wp-bot"
version = "0.1.0"
description = "WhatsApp community dashboard: live bridge, poll viewer, consent-gated contact export, keyword search, propensity scoring"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "supabase>=2.9",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
# B008 flags `= Depends(...)` in argument defaults -- that's the standard, required FastAPI
# dependency-injection idiom throughout this codebase, not a real mutable-default bug.
ignore = ["B008"]
